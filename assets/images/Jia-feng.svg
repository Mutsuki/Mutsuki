<svg xmlns="http://www.w3.org/2000/svg" width="200" height="90" viewBox="0 0 200 90">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=PT+Sans+Caption:wght@700&amp;display=swap');
    text { font-family: 'PT Sans Caption', 'Segoe UI', sans-serif; font-weight: 700; }
    .prefix { fill: #ff9900; font-size: 30px; }
    .dot { fill: #ff9900; font-size: 30px; }
    .badge-bg { fill: #6483ff; rx: 7; }
    .postfix { fill: #ffffff; font-size: 30px; }
    @media (prefers-color-scheme: dark) {
      .prefix { fill: #ff9900; }
      .dot { fill: #ff9900; }
      .badge-bg { fill: #6483ff; }
      .postfix { fill: #000000; }
    }
  </style>
  <text class="prefix" x="10" y="55">Jia</text>
  <text class="dot" x="73" y="55">.</text>
  <rect class="badge-bg" x="88" y="25" width="100" height="42" rx="7"/>
  <text class="postfix" x="100" y="55">feng</text>
</svg>
